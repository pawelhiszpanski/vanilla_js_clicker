<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clicker Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main id="game_container">
  <h1 id="header">Clicker Game</h1>

  <button id="start_button">START GAME</button>
  <div id="stats_panel">
    <p>Time: <span id="time_display">10.00</span> s</p>
    <p>Score: <span id="score_display">0</span></p>
    <p>CPS: <span id="cps_display">0.00</span></p>
  </div>
  <p id="personal_info">Personal Best: <span id="best_score_display">0</span></p>

  <button id="click_button" disabled>
    <span id="press_text">CLICK</span>
  </button>

  <button id="open_leaderboard">Show Leaderboard</button>

</main>

<div id="leaderboard_modal" class="modal_hidden">
  <h2>🏆 Top Scores</h2>
  <button id="close_leaderboard">&times;</button>

  <div id="leaderboard_content">
    <ol id="leaderboard_list"></ol>
  </div>
</div>

<script src="index.js"></script>

</body>
</html>
